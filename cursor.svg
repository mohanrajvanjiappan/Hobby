<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <g transform="translate(15, 15) rotate(-15)">
    <!-- wrist -->
    <path d="M 25,75 Q 15,75 10,90 L 70,90 Q 65,75 55,75 Z" fill="url(#g)" stroke="#ffffff" stroke-width="3"/>
    <!-- thumb -->
    <path d="M 25,50 C 0,50 0,75 25,75 Z" fill="#ffffff" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- middle finger -->
    <rect x="50" y="35" width="25" height="16" rx="8" fill="#ffffff" stroke="url(#g)" stroke-width="4"/>
    <!-- ring finger -->
    <rect x="50" y="48" width="25" height="16" rx="8" fill="#ffffff" stroke="url(#g)" stroke-width="4"/>
    <!-- pinky finger -->
    <rect x="45" y="61" width="25" height="16" rx="8" fill="#ffffff" stroke="url(#g)" stroke-width="4"/>
    
    <!-- hand body -->
    <rect x="25" y="42" width="35" height="35" rx="10" fill="#ffffff" />
    
    <!-- pointing finger -->
    <rect x="30" y="5" width="18" height="45" rx="9" fill="#ffffff" stroke="url(#g)" stroke-width="4"/>
    
    <!-- hand body strokes (drawn over to mask intersections) -->
    <path d="M 25,42 L 25,77" stroke="url(#g)" stroke-width="4"/>
    <path d="M 60,42 L 60,77" stroke="url(#g)" stroke-width="4"/>
    
    <!-- 3 back lines -->
    <path d="M 35,55 L 35,68 M 43,55 L 43,68 M 51,55 L 51,68" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
